<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Offline · UniLink</title>
  <style>
    * { box-sizing: border-box }
    :root { color-scheme: light dark; font-family: system-ui, sans-serif }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px }
    main { width: 100%; max-width: 28rem }
    h1 { letter-spacing: -.04em; font-size: clamp(2rem, 7vw, 3rem); margin: 1rem 0 .5rem }
    p { line-height: 1.6; margin: 0 0 1.5rem }
    a { display: inline-block; text-decoration: none; font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: .75rem; background: #1d4ed8; color: white; padding: .85rem 1.5rem }
  </style>
</head>
<body>
  <main>
    <strong>UniLink</strong>
    <h1>You’re offline</h1>
    <p>Reconnect to open your workspace and sync your devices.</p>
    <a href="">Try again</a>
  </main>
</body>
</html>
