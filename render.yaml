services:
  - type: web
    name: unilink
    runtime: node
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8787"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: JWT_REMEMBER_ME_EXPIRES_IN
        value: 7d
      - key: VAULT_SECRET
        sync: false
      # Must include the frontend origin(s), comma-separated, e.g.
      # https://unilink-frontend-omky.onrender.com (the API also auto-allows
      # *.onrender.com hosts containing "unilink", this is defence in depth).
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ALLOW_OTP_FALLBACK
        value: "true"
      - key: ALLOW_DEMO_GOOGLE_LOGIN
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Email delivery (required for OTP/reset codes to ARRIVE by email).
      # Without these, the API shows a temporary on-screen code instead.
      # Set them in the Render dashboard (e.g. Gmail App Password or Mailtrap).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
